# v2.4.5

# A deployment template that works out of the box
# It supports these objectives:
# - Deploy to Maven (Build Job) [Secrets: MAVEN_USERNAME, MAVEN_PASSWORD]
# - Deploy to CurseForge (Upload Job) [Secrets: CURSEFORGE_TOKEN]
# - Deploy to Modrinth (Upload Job) [Secrets: MODRINTH_TOKEN]

name: Deploy

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
            MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
            CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
            MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7

            -   name: Grant Execute Permission for gradlew
                run: chmod +x gradlew

            -   name: Read gradle.properties
                uses: BrycensRanch/read-properties-action@v1
                id: properties
                with:
                    file: project.properties
                    all: true

            -   name: Setup Java
                uses: actions/setup-java@v6.3.0
                with:
                    java-version: '25'
                    distribution: 'zulu'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6.4.1

            -   name: Publish to Maven
                if: >-
                    steps.properties.outputs.publish_to_maven == 'true'
                    && steps.properties.outputs.publish_to_local_maven == 'true'
                    && env.MAVEN_USERNAME != ''
                    && env.MAVEN_PASSWORD != ''
                run: |
                    ./gradlew publish \
                      "-P${{ steps.properties.outputs.maven_name }}Username=$MAVEN_USERNAME" \
                      "-P${{ steps.properties.outputs.maven_name }}Password=$MAVEN_PASSWORD"

            -   name: Publish to CurseForge
                if: >-
                    steps.properties.outputs.publish_to_curseforge == 'true'
                    && env.CURSEFORGE_TOKEN != ''
                run: ./gradlew publishCurseforge

            -   name: Publish to Modrinth
                if: >-
                    steps.properties.outputs.publish_to_modrinth == 'true'
                    && env.MODRINTH_TOKEN != ''
                run: ./gradlew publishModrinth
