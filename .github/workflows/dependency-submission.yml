name: Dependency Submission

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: chmod +x gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            25

      - uses: gradle/actions/dependency-submission@v6.4.1
