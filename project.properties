# =====================================================================================
#  MOD PROPERTIES
# =====================================================================================
#  This file is meant to be edited. Fill in the properties below to describe your mod.
#  The buildscript reads them to generate mod metadata (mcmod.info), the README and
#  publishing information.
#
#  Format:
#    key = value
#
#  Notes:
#  - Properties with an empty value must be filled in before the first build.
#  - Values can reference other properties with ${name}, e.g. ${mod_id}. References are
#    evaluated by the buildscript at runtime.
#  - Do not rename or remove properties. Only change their values.
#  - For lists (authors, credits), separate the entries with commas.
#  - This file is never touched by buildscript updates (./gradlew updateBuildScript),
#    so your values are safe.
#
#  Sections:
#    1. Identity     package, id, name and version of the mod
#    2. Metadata     description, links, authors, credits and logo
#    3. README       values used by the README.md generator
# =====================================================================================

# ---- 1. Identity --------------------------------------------------------------------

# The root package for your mod's main class. Change this to your own package.
# This should match the directory structure of your main class.
root_package = org.ender_development

# The mod id is a unique identifier for your mod. It must be all lowercase and contain no spaces.
mod_id = template_mod

# The mod name is the display name for your mod. This can contain spaces and capitalization.
mod_name = Ender-Development.org Template

# ---- 2. Metadata --------------------------------------------------------------------

# A short description of your mod.
mod_description = Universal Java / Kotlin Template for Minecraft 1.12 utilizing the latest tooling. If you have further questions, feel free to reach out to us.

# The URL to the mod's homepage or GitHub repository.
mod_url = https://github.com/Ender-Development/EnderDevelopmentTemplate

# Authors of the mod. Separate multiple authors with commas.
mod_authors = Ender-Development.org

# Credits for the mod. Separate multiple credits with commas.
mod_credits = MasterEnderman, rozbrajaczpoziomow

# The logo path for the mod. This should be a path to a PNG file within the assets folder of your mod.
mod_logo_path = assets/${mod_id}/textures/logo.png

# ---- 3. README ----------------------------------------------------------------------

# Values for the README.md generator.
# The license of your mod as an SPDX identifier, e.g. LGPL-3.0 or MIT.
# Full list: https://spdx.org/licenses/
# It is shown as the license shield in the README, which links to the LICENSE file in
# your repository, so make sure that file exists.
license = LGPL-3.0-only

# The content section of the generated README.md.
# Use <br> for line breaks in the output and single quotes (') instead of double quotes (").
# Long values can be split over several lines by ending each line with a backslash (\),
# which only improves readability in this file and does not add a line break to the output.
readme = <a href='https://www.akliz.net/enderman'><img src='https://raw.githubusercontent.com/Ender-Development/.github/refs/heads/master/assets/ender-development/banner.png' alt='Promotional Banner'/></a><br><br>\
  # About<br>\
  This is the successor to our [Catalyx-Template](https://github.com/Ender-Development/Catalyx-Template). The main changes are:<br>\
  - adapted [RFG 2.0+](https://github.com/GTNewHorizons/RetroFuturaGradle/releases), which requires Java 25 in the dev env<br>\
  - removed the build-in plugin, everything is now handled by `build.gradle.kts` and `settings.gradle.kts`<br>\
  - choose between Java and Kotlin, write your mod in whatever language you prefer<br>\
  - project configuration through `project.properties`, `dependencies.properties`, and `tags.properties`<br>\
  - the `gradle.properties` file is no longer intended to be edited by the user<br>\
  - automated property documentation, see [PROPERTIES.md](gradle/template/PROPERTIES.md)<br>\
  - automated mixin file generation<br>\
  - automated `README.md` population<br>\
  - all `*.properties` can be used in lang and mixin files<br>\
  - dependencies are managed via a `keys#url` approach, for more information check out `dependencies.properties`<br><br>\
  Besides these the template still offers:<br>\
  - automatic Tag (Java) / Reference (Kotlin) class creation, based on `tags.properties`<br>\
  - built-in mixin, coremod and access transformer support, all configured via the `project.properties` defaulting to the common Ender-Development.org values<br>\
  - credential management via `secrets.properties`, check `secrets.example.properties` for a template<br>\
  - providing most common mavens by default

