  If you aren't located in the [US](https://www.akliz.net/enderman), Akliz now offers servers in:<br>\
  - [Europe](https://www.akliz.net/enderman-eu)<br>\
  - [Oceania](https://www.akliz.net/enderman-oce)

# ---- 4. Advanced --------------------------------------------------------------------

# Optional overrides. Every property documented can be set here to
# change the buildscript's behavior. You only need to add the ones you want to change.
# Reference: https://github.com/Ender-Development/EnderDevelopmentTemplate/blob/master/gradle/template/PROPERTIES.md
#
# Leave a property commented out to keep its default. Only uncomment it when you want
# to set your own value. Properties marked as required in the docs have no
# default and must be set.
#
# Example (this is the default, shown for illustration):
# access_transformer_location = ${mod_id}_at.cfg
use_kotlin = true
use_catalyx = true
